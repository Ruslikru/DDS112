services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: dispetcher
      POSTGRES_USER: dispetcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispetcher"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dispetcher:${POSTGRES_PASSWORD}@db:5432/dispetcher
      DATA_DIR: /data
      SEED_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
